name: API

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: # "Run workflow" button, for redeploying master by hand

permissions:
  contents: read

jobs:
  # Path filtering happens here, not under `on:`: a workflow skipped by `paths`
  # leaves its checks pending, which would block PRs that require ci-ok.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            push) base=$PUSH_BEFORE head=$GITHUB_SHA ;;
            *) base='' head='' ;;
          esac
          # Manual runs, new branches and unknown bases test (and deploy) everything.
          api=true app=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base...$head")
            grep -qE '^(liftbig-api/|\.github/workflows/api\.yml$)' <<<"$changed" || api=false
            # This file calls app.yml, so a change to either runs the app job.
            grep -qE '^(liftbig-app/|\.github/workflows/(app|api)\.yml$)' <<<"$changed" || app=false
          fi
          echo "api=$api" | tee -a "$GITHUB_OUTPUT"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: liftbig-api
    services:
      postgres:
        image: postgres:15-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: liftbig
          POSTGRES_DB: liftbig_db
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database: any password connects
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liftbig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: liftbig
      DB_NAME: liftbig_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm
          cache-dependency-path: liftbig-api/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies # fails on high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Throwaway secrets # the API won't start without them
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Lint (no --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm run build
      - name: Unit tests
        run: npm test -- --ci
      - name: e2e tests
        run: npm run test:e2e -- --ci

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false # never kill a deploy mid-migration; queue the next one
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    defaults:
      run:
        working-directory: liftbig-api
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.RUNTIME_SA }} # empty: deploy.sh's liftbig-api-runtime default
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      PRIVACY_OPERATOR_NAME: ${{ vars.PRIVACY_OPERATOR_NAME }}
      PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Who am I
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)'
      - name: Deploy # uploads only liftbig-api/ (deploy.sh passes --source=<API folder>)
        run: scripts/deploy.sh --non-interactive
      - name: Smoke check
        run: |
          url=$(gcloud run services describe liftbig-api \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)')
          curl -fsS -o /dev/null -w '%{http_code} /privacy\n' "$url/privacy"

  # The one required check: passes when every job it needs passed or was skipped by path.
  ci-ok:
    if: always()
    needs: [changes, test, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
