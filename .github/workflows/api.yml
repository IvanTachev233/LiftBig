name: API

# Build once and promote (ADR 0023): a merge to master builds the API image once
# and deploys it to staging; a merge to production promotes the digest that
# staging ran for the same liftbig-api/ content, after the production
# environment's approval. Nothing is built for production.
on:
  pull_request:
    branches: [master, production]
  push:
    branches: [master, production]
  workflow_dispatch: # "Run workflow": on master redeploys staging, on production re-promotes

permissions:
  contents: read

env:
  # One registry for both projects (ADR 0023 1A); images are deployed by digest.
  IMAGE_REPO: europe-west1-docker.pkg.dev/liftbigapi/liftbig/api
  TOFU_VERSION: 1.13.9 # same as required_version in infra/envs/

jobs:
  # Path filtering happens here, not under `on:`: a workflow skipped by `paths`
  # leaves its checks pending, which would block PRs that require ci-ok.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      app: ${{ steps.diff.outputs.app }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            push) base=$PUSH_BEFORE head=$GITHUB_SHA ;;
            *) base='' head='' ;;
          esac
          # Manual runs, new branches and unknown bases test (and deploy) everything.
          api=true app=true infra=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base...$head")
            grep -qE '^(liftbig-api/|\.github/workflows/api\.yml$)' <<<"$changed" || api=false
            # This file calls app.yml, so a change to either runs the app job.
            grep -qE '^(liftbig-app/|\.github/workflows/(app|api)\.yml$)' <<<"$changed" || app=false
            grep -qE '^(infra/|\.github/workflows/api\.yml$)' <<<"$changed" || infra=false
          fi
          echo "api=$api" | tee -a "$GITHUB_OUTPUT"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
          echo "infra=$infra" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: liftbig-api
    services:
      postgres:
        image: postgres:15-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: liftbig
          POSTGRES_DB: liftbig_db
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database: any password connects
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liftbig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: liftbig
      DB_NAME: liftbig_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: liftbig-api/.nvmrc # same major as the Dockerfile
          cache: npm
          cache-dependency-path: liftbig-api/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies # fails on high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Throwaway secrets # the API won't start without them
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Lint (no --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm run build
      - name: Migrations build the empty database
        run: npm run migration:run
      - name: Entities match the migrations # fails when an entity change has no migration
        run: npm run migration:check
      - name: Unit tests
        run: npm test -- --ci
      - name: e2e tests
        run: npm run test:e2e -- --ci

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml

  # The image is named by the git tree hash of liftbig-api/ (its whole build
  # input): the same on master and production whatever merge button is used,
  # while every merge gives production new commit SHAs. On PRs it only checks
  # that the image builds; on master it pushes, or reuses an image already
  # built from the same tree.
  build:
    needs: [changes, test]
    if: >-
      needs.changes.outputs.api == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    outputs:
      image: ${{ steps.push.outputs.image }} # <IMAGE_REPO>@sha256:…; empty on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tree
        run: echo "tree=$(git rev-parse HEAD:liftbig-api)" | tee -a "$GITHUB_OUTPUT"
      - name: Build only (pull request)
        if: github.event_name == 'pull_request'
        run: docker build --target production -t api:check liftbig-api
      - id: auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # github-builder: Artifact Registry Writer on the liftbig repo, nothing else
          workload_identity_provider: ${{ vars.BUILD_WIF_PROVIDER }}
          service_account: ${{ vars.BUILD_SA }}
      - if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: push
        name: Build and push once, or reuse the image of this tree
        if: github.event_name != 'pull_request'
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          digest_of() {
            gcloud artifacts docker images describe "$1" --format='value(image_summary.digest)'
          }
          if digest=$(digest_of "$IMAGE_REPO:tree-$TREE" 2>/dev/null) && [ -n "$digest" ]; then
            echo "Reusing $IMAGE_REPO:tree-$TREE ($digest); not rebuilt."
            gcloud artifacts docker tags add "$IMAGE_REPO@$digest" "$IMAGE_REPO:$GITHUB_SHA" --quiet
          else
            docker build --target production \
              -t "$IMAGE_REPO:$GITHUB_SHA" -t "$IMAGE_REPO:tree-$TREE" liftbig-api
            docker push --all-tags "$IMAGE_REPO"
            digest=$(digest_of "$IMAGE_REPO:tree-$TREE")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for tree-$TREE: '$digest'" >&2; exit 1; }
          echo "image=$IMAGE_REPO@$digest" | tee -a "$GITHUB_OUTPUT"

  deploy-staging:
    needs: build
    if: needs.build.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging # deployment branch rule: master only
    concurrency:
      group: staging-api
      cancel-in-progress: false # never kill a deploy mid-migration; queue the next one
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    defaults:
      run:
        working-directory: liftbig-api
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      API_DOMAIN: https://staging-api.liftbig.co
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.RUNTIME_SA }} # empty: deploy.sh's liftbig-api-runtime default
      OMIT_SECRETS: ${{ vars.OMIT_SECRETS }} # staging: MAIL_PROVIDER_KEY,GITHUB_FEEDBACK_TOKEN
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      PRIVACY_OPERATOR_NAME: ${{ vars.PRIVACY_OPERATOR_NAME }}
      PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }} # empty: error reports off
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }} # staging
      BUG_REPORT_BUCKET: ${{ vars.BUG_REPORT_BUCKET }} # empty: screenshots not stored
      BUG_REPORTS_ENABLED: ${{ vars.BUG_REPORTS_ENABLED }} # staging: false (503)
      GITHUB_FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }} # empty: no GitHub issue is filed
      EXERCISE_MEDIA_BASE_URL: ${{ vars.EXERCISE_MEDIA_BASE_URL }} # staging demo media bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy by digest
        run: scripts/deploy.sh --non-interactive --image "$IMAGE"
      - name: Smoke check # 200 only when the new revision reaches the database
        run: |
          url=$(gcloud run services describe liftbig-api \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)')
          for base in "$url" "$API_DOMAIN"; do
            curl -fsS -o /dev/null -w "%{http_code} $base/health\n" "$base/health"
          done

  # Before anyone is asked to approve: the API content of production must have
  # passed staging. Finds a successful staging deployment (GitHub creates one
  # per deploy-staging job) of a commit with the same liftbig-api/ tree.
  release:
    needs: [changes, test]
    if: >-
      needs.changes.outputs.api == 'true' &&
      github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      staged: ${{ steps.find.outputs.staged }} # the master commit staging ran
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # staging's commits are on master, merged into this branch
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD:liftbig-api)
          echo "tree=$tree" | tee -a "$GITHUB_OUTPUT"
          staged=''
          while read -r id sha; do
            [ "$(git rev-parse --verify --quiet "$sha:liftbig-api")" = "$tree" ] || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = success ]; then
              staged=$sha
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=100" \
            --jq '.[] | "\(.id) \(.sha)"')
          if [ -z "$staged" ]; then
            echo "::error::No successful staging deployment of liftbig-api/ tree $tree. Merge it to master and wait for deploy-staging; production never builds."
            exit 1
          fi
          echo "Staging ran this API content at $staged."
          echo "staged=$staged" | tee -a "$GITHUB_OUTPUT"

  deploy-production:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # required reviewer; deployment branch rule: production only
    concurrency:
      group: production-api
      cancel-in-progress: false # never kill a deploy mid-migration; queue the next one
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    defaults:
      run:
        working-directory: liftbig-api
    env:
      TREE: ${{ needs.release.outputs.tree }}
      SENTRY_RELEASE: ${{ needs.release.outputs.staged }} # same release name as on staging
      # Deliberately no OMIT_SECRETS (all four secrets) and no SENTRY_ENVIRONMENT
      # (reports as production), whatever variables the environment has.
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.RUNTIME_SA }} # empty: deploy.sh's liftbig-api-runtime default
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      PRIVACY_OPERATOR_NAME: ${{ vars.PRIVACY_OPERATOR_NAME }}
      PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }} # empty: error reports off
      BUG_REPORT_BUCKET: ${{ vars.BUG_REPORT_BUCKET }} # empty: screenshots not stored
      BUG_REPORTS_ENABLED: ${{ vars.BUG_REPORTS_ENABLED }} # empty: on
      GITHUB_FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }} # Actions variables can't start with GITHUB_; empty: no GitHub issue is filed
      EXERCISE_MEDIA_BASE_URL: ${{ vars.EXERCISE_MEDIA_BASE_URL }} # demo media bucket URL empty: no exercise demos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy the digest staging ran
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE_REPO:tree-$TREE" \
            --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No image for tree-$TREE: '$digest'" >&2; exit 1; }
          scripts/deploy.sh --non-interactive --image "$IMAGE_REPO@$digest"
      - name: Smoke check # 200 only when the new revision reaches the database
        # The run.app URL (older installed builds) first, then the domain (versionCode 4 on)
        run: |
          url=$(gcloud run services describe liftbig-api \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)')
          for base in "$url" https://api.liftbig.co; do
            curl -fsS -o /dev/null -w "%{http_code} $base/health\n" "$base/health"
          done

  # Signed AAB to Play internal testing, when a merge to production
  # changes the app. Doesn't wait for the production environment's approval: only
  # internal testers get it, and promotion past them is manual in Play Console.
  # Manual runs re-promote the API and upload nothing. Re-running a run that
  # already uploaded is refused by Play, since run_number stays the same.
  play-upload:
    needs: [changes, app]
    if: >-
      needs.changes.outputs.app == 'true' &&
      github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play # deployment branch rule: production only
    concurrency:
      group: play-upload
      cancel-in-progress: false # queue the next merge: two uploads would open competing Play edits
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    defaults:
      run:
        working-directory: liftbig-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: liftbig-app/.nvmrc
          cache: npm
          cache-dependency-path: liftbig-app/package-lock.json
      # No Gradle cache: production runs can restore master's caches, and this job signs a release.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21' # capacitor.build.gradle compiles for Java 21
      - name: Install # plain `npm ci` fails on ng2-charts' @angular/cdk peer; also set in .npmrc
        run: npm ci --legacy-peer-deps
      - name: Build the web app against the production API
        run: |
          npm run build
          npx cap sync android
      - name: Set the version code and release note
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)
          [ -n "$name" ] || { echo "::error::No versionName in build.gradle"; exit 1; }
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/whatsnew" # en-GB is the Play listing's language
          printf '%s (%s), %s\n' "$name" "$code" "${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/whatsnew/whatsnew-en-GB"
      - name: Build the signed bundle
        working-directory: liftbig-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          (umask 077; base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH")
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:bundleRelease "-PversionCode=$VERSION_CODE"
      # After the build, so nothing the build runs can see the Play credential.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SA }}
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.liftbig.app
          releaseFiles: liftbig-app/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal # the action's default is production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

  # OpenTofu. Read-only: on a PR it reports what would change, on
  # master it saves the plans the two apply jobs run. This repo is public, so
  # only addresses and actions are published; see infra/ci/. After
  # deploy-staging, so that staging's plan sees the revision this merge deployed.
  # Forks and Dependabot get no OIDC token, so their runs skip it.
  tofu-plan:
    needs: [changes, deploy-staging]
    if: >-
      !cancelled() && needs.changes.outputs.infra == 'true' && (
        (github.event_name == 'pull_request' && github.base_ref == 'master' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.actor != 'dependabot[bot]') ||
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
      pull-requests: write # the summary comment
    outputs:
      staging: ${{ steps.staging.outputs.object }} # empty: nothing to apply
      production: ${{ steps.production.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false # the wrapper would log tofu's output and expose it as step outputs
      - run: tofu fmt -check -recursive infra
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TOFU_PLAN_WIF_PROVIDER_STAGING }}
          service_account: ${{ vars.TOFU_PLAN_SA_STAGING }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: staging
        name: Plan staging
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          : "${TF_VAR_alert_email:?Set the repository secret ALERT_EMAIL}"
          infra/ci/tofu-plan.sh staging liftbig-staging-tfstate
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TOFU_PLAN_WIF_PROVIDER_PRODUCTION }}
          service_account: ${{ vars.TOFU_PLAN_SA_PRODUCTION }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: production
        name: Plan production
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          : "${TF_VAR_alert_email:?Set the repository secret ALERT_EMAIL}"
          infra/ci/tofu-plan.sh production liftbigapi-tfstate
      - name: Publish the summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$RUNNER_TEMP/tofu-summary.md"
          cat "$report" >>"$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          marker='<!-- tofu-plan -->'
          body="$RUNNER_TEMP/tofu-comment.md"
          printf '%s\n### OpenTofu plan of %s\n\n' "$marker" "$HEAD_SHA" | cat - "$report" >"$body"
          # One comment per PR, updated on each push. Only the bot's own: anyone can comment on a public repo.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" --silent
          fi

  # The explicit status checks in the two apply jobs are needed: by default a
  # job is skipped when any job earlier in its chain was, and deploy-staging is
  # skipped on every merge that doesn't touch the API.
  tofu-apply-staging:
    needs: tofu-plan
    if: >-
      !cancelled() && needs.tofu-plan.result == 'success' &&
      github.event_name != 'pull_request' && needs.tofu-plan.outputs.staging != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-staging # deployment branch rule: master only; the merge is the gate
    concurrency:
      group: tofu-staging
      cancel-in-progress: false # never kill an apply halfway
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TOFU_WIF_PROVIDER }}
          service_account: ${{ vars.TOFU_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Apply the saved plan
        env:
          OBJECT: ${{ needs.tofu-plan.outputs.staging }}
        run: infra/ci/tofu-apply.sh staging "$OBJECT"

  # Staging first; a plan that changes only production skips staging's job.
  # Its own concurrency group, not production-api: this job can wait days for
  # approval, and that must not hold up an API release.
  tofu-apply-production:
    needs: [tofu-plan, tofu-apply-staging]
    if: >-
      !cancelled() && needs.tofu-plan.result == 'success' &&
      (needs.tofu-apply-staging.result == 'success' || needs.tofu-apply-staging.result == 'skipped') &&
      github.event_name != 'pull_request' && needs.tofu-plan.outputs.production != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-production # required reviewer; deployment branch rule: master only
    concurrency:
      group: tofu-production
      cancel-in-progress: false # never kill an apply halfway
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TOFU_WIF_PROVIDER }}
          service_account: ${{ vars.TOFU_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Apply the saved plan
        env:
          OBJECT: ${{ needs.tofu-plan.outputs.production }}
        run: infra/ci/tofu-apply.sh production "$OBJECT"

  # The one required check: passes when every job it needs passed or was skipped by path.
  ci-ok:
    if: always()
    needs: [changes, test, app, build, play-upload, tofu-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
