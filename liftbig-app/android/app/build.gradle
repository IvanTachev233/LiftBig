apply plugin: 'com.android.application'

// Release signing values: from these env vars when ANDROID_KEYSTORE_PATH is set,
// otherwise from android/keystore.properties (git-ignored); see README "Release build"
def keystoreEnv = [
    storeFile    : 'ANDROID_KEYSTORE_PATH',
    storePassword: 'ANDROID_KEYSTORE_PASSWORD',
    keyAlias     : 'ANDROID_KEY_ALIAS',
    keyPassword  : 'ANDROID_KEY_PASSWORD',
]
def signingFromEnv = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull as boolean
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (signingFromEnv) {
    keystoreEnv.each { key, envName ->
        def value = providers.environmentVariable(envName).orNull
        if (value) {
            keystoreProperties.setProperty(key, value)
        }
    }
} else if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// CI passes -PversionCode 
def versionCodeOverride = providers.gradleProperty('versionCode').orNull

android {
    namespace = "com.liftbig.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.liftbig.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode here is only for builds without -PversionCode; Play's latest comes from CI. versionName is what users see
        versionCode(versionCodeOverride ? versionCodeOverride.toInteger() : 15)
        versionName "0.4.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                // Relative paths resolve from android/
                storeFile rootProject.file(keystoreProperties['storeFile'])
            }
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Stops release builds (debug builds are unaffected) before anything compiles when signing isn't set up,
// so an unsigned bundle is never produced
def checkReleaseSigning = tasks.register('checkReleaseSigning') {
    doLast {
        if (!signingFromEnv && !keystorePropertiesFile.exists()) {
            throw new GradleException("Release signing: ${keystorePropertiesFile} is missing. Create it with storeFile, storePassword, keyAlias and keyPassword (see README \"Release build\").")
        }
        def missing = keystoreEnv.keySet().findAll { !keystoreProperties.getProperty(it)?.trim() }
        if (missing) {
            def source = signingFromEnv ? 'The environment' : keystorePropertiesFile
            throw new GradleException("Release signing: ${source} has no value for ${missing.collect { signingFromEnv ? keystoreEnv[it] : it }.join(', ')}.")
        }
        def keystore = rootProject.file(keystoreProperties['storeFile'])
        if (!keystore.isFile()) {
            def source = signingFromEnv ? 'ANDROID_KEYSTORE_PATH' : "storeFile in ${keystorePropertiesFile.name}, relative to android/"
            throw new GradleException("Release signing: keystore not found at ${keystore} (${source}).")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn checkReleaseSigning
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
